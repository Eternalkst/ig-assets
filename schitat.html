<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сколько вы теряете</title>
<meta name="description" content="Калькулятор: сколько денег теряет ваше дело на сообщениях без ответа. Три числа и готовая сумма.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0B0805; --card: #15100A; --line: #3A2C16; --txt: #F6EFE2; --mut: #B9AC93; --gold: #F3D27E; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--txt); font-family: 'Manrope', system-ui, sans-serif; line-height: 1.5; font-size: 17px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  .hero { text-align: center; padding: 44px 0 14px; }
  h1 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: clamp(30px, 8vw, 42px); line-height: 1.08; }
  .gold { background: linear-gradient(100deg, #8A5F22, #C9973F 22%, #F7DC94 45%, #FFF6DA 52%, #F7DC94 60%, #C9973F 80%, #8A5F22); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .field { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
  label { display: block; font-weight: 800; }
  .hint { color: var(--mut); font-size: 14.5px; margin-top: 2px; }
  input { width: 100%; min-height: 48px; margin-top: 10px; padding: 0 14px; font: 800 22px 'Manrope', sans-serif; color: var(--txt); background: #221909; border: 1px solid #5A4318; border-radius: 12px; }
  input:focus { outline: 2px solid var(--gold); }
  .result { text-align: center; background: linear-gradient(160deg, #2A1C08, var(--card) 70%); border: 1px solid #5A4318; border-radius: 20px; padding: 24px 16px; margin-top: 18px; }
  .sum { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: clamp(38px, 11vw, 56px); line-height: 1.1; color: #FF5A5A; margin-top: 6px; }
  .year { color: var(--mut); margin-top: 6px; }
  .note { color: var(--mut); font-size: 14px; margin-top: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 18px; min-height: 52px; padding: 14px; border-radius: 14px; background: linear-gradient(180deg, #F7DC94, #D9A94E); color: #1E1609; font-weight: 800; text-decoration: none; }
  .end { text-align: center; margin-top: 24px; color: var(--mut); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Сколько вы <span class="gold">теряете</span></h1></div>

  <div class="field"><label for="a">Сколько сообщений в день остаётся без ответа</label><div class="hint">Или ответ приходит, когда уже поздно</div><input id="a" type="number" inputmode="numeric" min="0" value="1"></div>
  <div class="field"><label for="b">Какая часть из них могла купить, %</label><div class="hint">Если не знаете, оставьте 30</div><input id="b" type="number" inputmode="numeric" min="0" max="100" value="30"></div>
  <div class="field"><label for="c">Ваш средний чек, ₸</label><input id="c" type="number" inputmode="numeric" min="0" value="15000"></div>

  <div class="result">
    <div>В месяц вы можете терять</div>
    <div class="sum" id="sum"></div>
    <div class="year" id="year"></div>
    <p class="note">Это примерная оценка: 30 дней в месяце и ваши числа. Настоящая сумма зависит от дела.</p>
  </div>

  <a class="btn" href="https://valeriy-ai-praktikum.pages.dev/?src=calc">Как перестать терять: ИИ-практикум</a>
  <p class="end">Офлайн в Костанае и онлайн · Валерий Просоленко</p>
</div>
<script>
const v = (id) => Math.max(0, Number(document.getElementById(id).value) || 0);
const fmt = (n) => Math.round(n).toLocaleString("ru-RU") + " ₸";
function calc() {
  const month = v("a") * 30 * (Math.min(v("b"), 100) / 100) * v("c");
  document.getElementById("sum").textContent = fmt(month);
  document.getElementById("year").textContent = "За год: " + fmt(month * 12);
}
["a", "b", "c"].forEach((id) => document.getElementById(id).addEventListener("input", calc));
calc();
</script>
</body>
</html>
